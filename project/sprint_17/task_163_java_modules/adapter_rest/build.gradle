plugins {
	id 'maven-publish'
}

ext {
	set("springBootVersion", "3.4.5")
}

dependencies {
	implementation project(":project:sprint_17:task_163_java_modules:adapter_dto")
	implementation project(":project:sprint_17:task_163_java_modules:core_api")
	implementation project(":project:sprint_17:task_163_java_modules:core_services")

	implementation("org.springframework.boot:spring-boot-starter-web:$springBootVersion")

	implementation('com.google.guava:guava:31.0.1-jre')

	compileOnly('org.projectlombok:lombok:1.18.32')
	annotationProcessor('org.projectlombok:lombok:1.18.32')

}

jar {
	enabled = true
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			// Identify the artifact
			artifact jar  // This refers to the Spring Boot's bootJar task

			// Project coordinates
			groupId = 'org.javaguru'
			artifactId = 'insurance-calculator-adapter-rest'
			version = '1.0.0'

			// Add other metadata as needed
			pom {
				name = 'Insurance Calculator Application'
				description = 'Application to calculate travel insurance premium'
				licenses {
					license {
						name = 'The Apache License, Version 2.0'
						url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
					}
				}
			}
		}
	}

	// Configure the repository location (local Maven repository)
	repositories {
		mavenLocal()
	}
}
